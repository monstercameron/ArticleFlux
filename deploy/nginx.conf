# ArticleFlux — nginx site.
#
# Install to /etc/nginx/sites-available/articleflux, symlink into
# sites-enabled/, replace reader.example.com throughout, then let certbot fill
# in the TLS block:
#
#   sudo certbot --nginx -d reader.example.com
#
# Run this file through `nginx -t` before reloading. Every reload of a bad
# config is a site that stays down until someone notices.

# --- REACHABLE BY IP, TODAY ----------------------------------------------------
#
# The named vhosts below are the destination; this block is what makes the box
# usable before a hostname exists. nginx matches server blocks by `Host`, so a
# config that only knows `reader.example.com` answers nothing at all when someone
# types the droplet's IP into a browser — no 404, no error page, just a dropped
# connection, which is indistinguishable from a firewall or a dead box and cost
# an evening of looking at the wrong things.
#
# `default_server` is what fixes that: it is the block nginx falls back to when no
# `server_name` matches, so http://<droplet-ip>/ reaches the reader.
#
# **Remove this block once DNS and TLS exist.** It serves the application over
# plaintext, which is fine for an IP nobody has bookmarked and not fine for
# anything a person logs into: the session token crosses the wire in the clear.
# It stays until `server_name` below is real and certbot has run, and not longer.
#
# One `default_server` per port per machine — nginx refuses to start with two.
# The portfolio's config takes :8080 for the same purpose, so both apps are
# reachable on this box without either owning the other's port.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 8m;

    # The tunnel. Copied rather than referenced because nginx has no include for
    # a location group, and an IP-reachable reader whose WebSocket does not
    # upgrade is the worst of both worlds: the page loads, and then nothing ever
    # arrives. See the annotated copy in the TLS block below for why each line is
    # here.
    location /grpc {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /shots/ {
        alias /opt/articleflux/bin/web/shots/;
        try_files $uri =404;
    }

    # Operator-only surfaces (F38, §21). /metrics is unauthenticated BY DESIGN —
    # a scraper is a machine with no session — but "by design" means safe for
    # something running on this box, not safe for anyone on the internet, and
    # nothing before this line stopped a public request from reaching it.
    # /debug/ covers /debug/pprof/* (live only when -profiling is set) and
    # /debug/reset-state (live only in -dev mode, itself refused on any
    # non-loopback bind already) — closed here too, so a flag flipped on this
    # box is not also a hole in this nginx site. Collect metrics and profiles
    # from the loopback address directly, not through this vhost.
    location = /metrics { return 404; }
    location /debug/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:9000;
        access_log off;
    }
    location = /readyz {
        proxy_pass http://127.0.0.1:9000;
        access_log off;
    }
}

# HTTP exists only to hand people to HTTPS. certbot inserts its own ACME
# location above this; leave that in place.
#
# Inert until `server_name` is a real hostname: a request only reaches here when
# its Host matches, so with the placeholder below it never fires and the
# default_server above answers instead.
server {
    listen 80;
    listen [::]:80;
    server_name reader.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reader.example.com;

    # certbot writes these three lines. Left as comments so an un-certbot'd copy
    # of this file fails `nginx -t` loudly rather than silently serving plaintext.
    # ssl_certificate     /etc/letsencrypt/live/reader.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/reader.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    # A feed reader is a complete record of what someone reads, thinks about, and
    # saves for later. HSTS is not optional on that.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Deny framing outright. The app has no legitimate embedder, and clickjacking
    # a reader means tricking someone into marking, unsubscribing, or deleting.
    add_header X-Frame-Options "DENY" always;

    # 26 MB of wasm, and the client uploads nothing bigger than an OPML file.
    client_max_body_size 8m;

    # --- the gRPC tunnel -----------------------------------------------------
    #
    # ONE long-lived WebSocket carrying every RPC. Four settings here are
    # load-bearing and three of them have defaults that break it:
    #
    #   * Upgrade/Connection — without these the upgrade never happens and the
    #     client sits on "connecting" forever against a healthy server.
    #   * proxy_http_version 1.1 — nginx defaults to 1.0, which cannot upgrade.
    #   * proxy_read_timeout — defaults to 60s. The tunnel is idle whenever
    #     nobody is clicking, so the default severs it every minute; the client
    #     reconnects, so it presents as a reader that "refreshes randomly"
    #     rather than as a proxy timeout.
    #   * proxy_buffering off — buffered, nginx holds frames looking for a
    #     complete response that a stream never produces.
    location /grpc {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --- the homepage's screenshots ------------------------------------------
    #
    # Served off disk, never proxied. They are about 4 MB of JPEG that the front
    # door at /home asks for on a first visit, and every byte of that through the
    # Go process is a goroutine, a copy and a log line spent on a file that has
    # not changed since the build. nginx does this with sendfile and a header.
    #
    # `alias` and not `root`: the files live at /opt/articleflux/bin/web/shots/,
    # so a `root` would resolve /shots/x.jpg to <root>/shots/x.jpg and need the
    # directory named twice. The trailing slashes on both are required — drop
    # either and the path concatenation silently produces the wrong file.
    #
    # Immutable for a year because a rebuilt screenshot is a rebuilt FILE NAME's
    # contents, not a new address — so the cache is flushed by a deploy only if
    # the name changes. That is the honest trade for a page whose pictures change
    # a few times a year: a stale screenshot for a while, or a proxied megabyte
    # every visit. If it ever matters, add a query string to the src.
    #
    # try_files ... =404 rather than falling through to the app: a missing
    # screenshot should be a missing screenshot, not the wasm shell served with
    # an image content type.
    location /shots/ {
        alias /opt/articleflux/bin/web/shots/;
        try_files $uri =404;
        access_log off;
        expires 365d;

        # The four security headers are REPEATED, not inherited, and that is not
        # redundancy. nginx's add_header inherits from the enclosing block only
        # when the current block declares NONE of its own — so adding a single
        # Cache-Control here would silently drop HSTS, nosniff, the referrer
        # policy and the framing denial from every screenshot response. It is the
        # most quietly destructive rule in nginx's configuration language.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # --- operator-only surfaces (F38, §21) ------------------------------------
    #
    # /metrics is unauthenticated BY DESIGN — a scraper is a machine with no
    # session, and a metrics endpoint behind a login is a metrics endpoint
    # nobody collects. But "by design" describes what makes it SAFE to answer
    # without a login, not who should be able to reach it, and on a remote,
    # TLS, authenticated deployment (A9) that is nobody but the operator.
    # Request rates alone say when somebody reads.
    #
    # /debug/ covers /debug/pprof/* (live only when -profiling is set — CPU,
    # heap, block and mutex profiling, which costs measurable time and has no
    # business answering the public internet even briefly) and
    # /debug/reset-state (live only in -dev mode, itself refused on any
    # non-loopback bind already, so this is belt-and-suspenders). Closed here
    # too, so a flag flipped on this box for a debugging session is not also a
    # hole in this nginx site for as long as it stays flipped.
    #
    # Collect metrics and profiles from the loopback address directly — SSH
    # tunnel, or a Prometheus agent running on the box — not through this
    # vhost.
    location = /metrics { return 404; }
    location /debug/ { return 404; }

    # --- everything else -----------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        # Host must be forwarded faithfully. The tunnel's origin check compares
        # the browser's Origin against the request Host, so a proxy that sends
        # its own hostname makes every WebSocket upgrade look cross-origin and
        # get refused. (Setting -origin on the server pins this explicitly,
        # which is what the systemd unit does.)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # gzip is NOT enabled for the wasm bundle here, on purpose. The Go server
        # serves a precompressed app.wasm.gz built alongside the module, so nginx
        # re-compressing 26 MB per request would burn CPU to produce a worse
        # result. It already arrives with Content-Encoding: gzip.
        gzip off;
    }

    # The probes. Unauthenticated and information-free by design (§22.4), so they
    # are safe to expose — but access-logging a check that runs every ten seconds
    # buries everything else in the log.
    location = /healthz {
        proxy_pass http://127.0.0.1:9000;
        access_log off;
    }
    location = /readyz {
        proxy_pass http://127.0.0.1:9000;
        access_log off;
    }
}
