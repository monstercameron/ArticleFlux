syntax = "proto3";

// Package articleflux.v1 is the single contract behind all three transports (§20.7):
// the gRPC tunnel, the plain-HTTPS pack channel, and the Google Reader-compatible
// REST sync API. Additive changes only within v1 — `buf breaking` in CI enforces
// that rather than discipline, because the sync API and SW-cached wasm both
// guarantee old clients in the wild (§22.10).
package articleflux.v1;

option go_package = "github.com/monstercameron/ArticleFlux/internal/pb/articleflux/v1;articlefluxv1";

// SystemService is the unauthenticated surface: enough to answer "is this thing
// running, and which build am I talking to" before any credential exists.
//
// It exists at Tier 1 rather than Tier 7 because version skew is a real failure
// mode here (T12) — a wasm client cached by a Service Worker can outlive several
// server deploys, and it needs a way to notice.
service SystemService {
  // GetVersion identifies the build. Safe to call unauthenticated; it must never
  // grow a field that discloses tenant state.
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);

  // CheckHealth reports whether the server can serve reads. Used by the readiness
  // probe and by the client's always-visible connection indicator — a reader that
  // has silently stopped receiving looks identical to a quiet news day.
  rpc CheckHealth(CheckHealthRequest) returns (CheckHealthResponse);

  // GetServerStats is what the settings screen shows about the machine: uptime,
  // storage, how much of everything there is, and per-RPC latency.
  //
  // Authenticated, unlike GetVersion. It discloses row counts and database size,
  // which are tenant state — GetVersion must stay information-free because the
  // readiness probe calls it without a credential.
  rpc GetServerStats(GetServerStatsRequest) returns (GetServerStatsResponse);

  // ListLogs returns recent log records from the in-memory ring.
  //
  // A self-hosted reader has no operator: nobody is tailing a file, so "why did
  // that feed stop working" has to be answerable from inside the app.
  rpc ListLogs(ListLogsRequest) returns (ListLogsResponse);

  // ListAudioTracks names the music beds this instance ships (§19).
  //
  // On SystemService rather than ReaderService because a bed is a property of
  // the INSTANCE, not of a reader: the same four files are the same four files
  // for everybody, and nothing in the answer depends on who is asking.
  //
  // An instance that shipped without the audio directory answers with an empty
  // list, and the settings picker then offers silence and nothing else. That is
  // the correct degradation for optional background music.
  rpc ListAudioTracks(ListAudioTracksRequest) returns (ListAudioTracksResponse);

  // GetAudioTrack streams one bed's bytes down the tunnel.
  //
  // Over gRPC rather than as a plain URL, which is the opposite of the choice
  // /speech makes (§10.7) and is a deliberate one: the beds are part of the
  // application rather than part of anyone's reading, and keeping them on the
  // one authenticated connection means a deployment has exactly one door to
  // reason about instead of a static path beside it.
  //
  // The cost is real and worth naming here rather than discovering later: the
  // client cannot stream, seek or range-request this. It receives the whole
  // track, holds it in memory, and plays it from a blob — so a four megabyte
  // bed is four megabytes of wasm heap and a few seconds before the first note.
  // Chunked so the tunnel stays usable while it arrives; a single message would
  // park every other RPC behind it.
  rpc GetAudioTrack(GetAudioTrackRequest) returns (stream GetAudioTrackResponse);
}

message GetServerStatsRequest {}

message GetServerStatsResponse {
  string version = 1;
  string commit = 2;
  int64 schema_version = 3;
  // Seconds since the process started.
  int64 uptime_s = 4;
  string started_at = 5;

  // Storage.
  int64 db_bytes = 10;
  int64 wal_bytes = 11;
  string db_path = 12;

  // How much of everything there is. Scoped to the caller, not global.
  int32 feeds = 20;
  int32 items = 21;
  int32 unread = 22;
  int32 notes = 23;
  int32 tags = 24;
  int32 rated = 25;
  int32 saved = 26;   // read later

  // Runtime. Go's own numbers, because "is it the reader or is it my box" is the
  // first question and a heap figure answers it.
  int64 heap_bytes = 30;
  int32 goroutines = 31;
  int32 gc_cycles = 32;

  // Polling.
  string last_poll_at = 40;
  int32 poll_interval_s = 41;
  int32 dormant_feeds = 42;

  repeated MethodStat methods = 50;
  repeated LevelCount log_counts = 51;
}

// MethodStat is one row of the latency table. Durations are milliseconds:
// microsecond precision on a screen a person reads is noise.
message MethodStat {
  string method = 1;
  int64 calls = 2;
  int64 errors = 3;
  double p50_ms = 4;
  double p95_ms = 5;
  double max_ms = 6;
  double mean_ms = 7;
}

message LevelCount {
  string level = 1;
  int64 count = 2;
}

message ListLogsRequest {
  int32 limit = 1;
  // Minimum level: DEBUG | INFO | WARN | ERROR. Empty means INFO.
  string min_level = 2;
}

message ListLogsResponse { repeated LogRecord records = 1; }

message LogRecord {
  string time = 1;
  string level = 2;
  string message = 3;
  // Attributes pre-rendered as `key=value` pairs. The consumer is a settings
  // screen, not a query engine.
  string attrs = 4;
}

message GetVersionRequest {}

message GetVersionResponse {
  // Semantic version of the server build.
  string version = 1;
  // Git commit the binary was built from, or "unknown" for a local build.
  string commit = 2;
  // Highest applied migration. The client compares this across reconnects to
  // detect that it is talking to a different schema than it started on.
  int64 schema_version = 3;
}

message CheckHealthRequest {}

message CheckHealthResponse {
  ServingStatus status = 1;
  // Human-readable and always safe to display (§20.7): internal detail goes to
  // the log with the request id, never to the client.
  string detail = 2;
}

enum ServingStatus {
  SERVING_STATUS_UNSPECIFIED = 0;
  // Reads and writes both available.
  SERVING_STATUS_SERVING = 1;
  // Reads available, writes refused — storage read-only, or a migration running.
  SERVING_STATUS_DEGRADED = 2;
  // Not ready to serve. Distinct from unreachable, which the client sees as a
  // transport error instead.
  SERVING_STATUS_NOT_SERVING = 3;
}

// --- the broadcast's music beds (§19) ----------------------------------------

message ListAudioTracksRequest {}

// AudioTrack is one bed, as the settings picker needs it.
message AudioTrack {
  // Stable slug, and the only thing GetAudioTrack accepts. It is matched against
  // a fixed set on the server rather than joined onto a path, so it cannot name
  // a file outside the audio directory.
  string id = 1;
  // The track's name, as its author wrote it. A proper noun: not translated.
  string title = 2;
  // How big it is. The client shows nothing with this today; it is here because
  // "the reader is about to pull four megabytes through the tunnel" is a fact
  // the UI will eventually want to state, and adding it later is a wire change.
  int64 bytes = 3;
}

message ListAudioTracksResponse {
  repeated AudioTrack tracks = 1;
}

message GetAudioTrackRequest {
  string id = 1;
}

// GetAudioTrackResponse is a slice of one track, in order.
//
// A bare bytes field with no offset or index: gRPC delivers a server stream in
// order, so a sequence number would be a second source of truth for something
// the transport already guarantees — and one that could disagree with it.
message GetAudioTrackResponse {
  bytes data = 1;
}
