syntax = "proto3";

package articleflux.v1;

option go_package = "github.com/monstercameron/ArticleFlux/internal/pb/articleflux/v1;articlefluxv1";

// AuthService mints and retires sessions. It is the only service that may be
// called without a credential, because it is where credentials come from.
//
// Why this exists at all: before it, `DevMode` was derived from a loopback bind,
// and the standard reverse-proxy deployment — nginx on :443 forwarding to
// 127.0.0.1:9000 — is a loopback bind. That combination served the first user's
// superadmin scope to anyone who could reach the domain. The bind address is a
// fact about network topology and says nothing about who is on the other end;
// authentication has to be its own thing, so here it is.
//
// Scope: this is TODO 6.1 minus the parts 6.1 also lists — there is no lockout,
// no refresh family with reuse detection, no recovery code, no reset token, and
// no sudo mode. What is here is a password check that always runs the hash, a
// uniform error, a per-IP-and-per-user attempt limiter, and a revocable
// server-side session. That is the floor for putting this on the public
// internet, not the ceiling, and the rest of 6.1 remains owed.
service AuthService {
  // Login exchanges a username and password for a session token.
  //
  // The token is returned once and never again — the server stores only its
  // SHA-256, so a database dump does not hand out live sessions (see
  // internal/secret on why tokens are hashed fast and passwords are not).
  rpc Login(LoginRequest) returns (LoginResponse);

  // Logout revokes the calling session. Idempotent: logging out twice, or with a
  // token the server has already forgotten, succeeds.
  //
  // It revokes the one session rather than the device family, because a family
  // is 6.1's refresh-token work and this has no refresh tokens to detect reuse
  // across.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // WhoAmI reports who the caller is, and is how the client decides between
  // showing the reader and showing the login screen.
  //
  // It is separate from GetVersion on purpose: GetVersion must stay
  // information-free for the readiness probe, and this one deliberately is not.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);

  // RefreshSession exchanges a refresh token for a new session, and rotates the
  // refresh token itself (§7.3, TODO 6.1).
  //
  // Named RefreshSession rather than Refresh because `Refresh` is already the
  // reader's "go and poll my feeds now" — two operations that share a verb and
  // nothing else, in one package, is how somebody eventually calls the wrong
  // one from a retry loop.
  //
  // The reason it exists is REUSE DETECTION, not convenience. A refresh token
  // is single-use: presenting one that has already been exchanged means either
  // a replay or a stolen token being used alongside the real client, and the
  // server cannot tell those apart — so it revokes the whole device family and
  // refuses. §7.3 counts that as one of the four controls standing in for the
  // second factor this application does not have.
  //
  // Unauthenticated by design: the refresh token IS the credential, and a
  // caller with an expired session has nothing else to present.
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);

  // Reauthenticate re-proves the password on an existing session, opening a
  // sudo window (§7.3, TODO 6.1).
  //
  // This is the primitive the whole of sudo mode rests on, and without it the
  // policy could never be SATISFIED — only failed. A session records when its
  // holder last proved who they are; ordinary traffic deliberately does not
  // refresh that stamp, because a control that demands a password must not be
  // satisfied by reading articles. So there has to be one call whose entire job
  // is to ask for the password again, and this is it.
  //
  // It does NOT mint a new session. A re-authentication is the same person on
  // the same device answering a question, not a new login, and rotating the
  // token here would log out every other tab to confirm a password.
  rpc Reauthenticate(ReauthenticateRequest) returns (ReauthenticateResponse);

  // ChangePassword replaces the caller's password and ends every other session.
  //
  // Requires a fresh sudo window rather than asking for the current password
  // again. Those are the same check — proving you are the person, not the
  // browser — and asking twice inside fifteen minutes trains people to type
  // their password into whatever asks for it, which is the habit that makes
  // phishing work.
  //
  // Every OTHER session is revoked, and the caller's own is kept. Ending the
  // thief's sessions is most of what changing a password is for; ending the
  // caller's as well would log out the person who just did the right thing, on
  // the screen where they were most likely mid-task.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // RegenerateRecoveryCodes issues a fresh sheet and discards the old one.
  //
  // Requires sudo, because it is the operation that decides who can get back
  // into the account without a password. The codes are returned ONCE, in
  // plaintext, here — the server stores only their hashes, so a caller who does
  // not write them down has to generate another set.
  //
  // Replacing rather than adding is the security property: this is what someone
  // does when they believe the old sheet is compromised, and survivors would
  // make it a no-op that looked like it worked.
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest)
      returns (RegenerateRecoveryCodesResponse);
}

message ReauthenticateRequest {
  // password is the caller's current password. There is no username: the
  // session already says who this is, and accepting one would let a caller
  // re-authenticate as somebody else on a session that is not theirs.
  string password = 1;
}

message ReauthenticateResponse {
  // sudo_expires_at is when the window closes, RFC3339. Returned so the client
  // can hide an action that is about to need the password again rather than
  // offering it and failing — the number is not a secret, and the alternative
  // is a UI that guesses at a constant the server owns.
  string sudo_expires_at = 1;
}

message ChangePasswordRequest {
  // new_password is checked against the same policy as any other password:
  // length, and the bundled breached-password list with its folding. A password
  // change is the one moment someone is thinking about their password, which
  // makes it the best moment to refuse a bad one.
  string new_password = 1;
}

message ChangePasswordResponse {
  // sessions_ended counts the OTHER sessions revoked, so the client can say
  // "signed out of 3 other devices" rather than leaving someone to wonder
  // whether the change did anything beyond the password.
  int32 sessions_ended = 1;
}

message RegenerateRecoveryCodesRequest {}

message RegenerateRecoveryCodesResponse {
  // codes are plaintext and appear here exactly once.
  repeated string codes = 1;
}

message RefreshSessionRequest {
  // device_id names which device is refreshing. The refresh token alone would
  // be enough to find the row, but naming the device means a token presented
  // against the wrong device is a mismatch rather than a lookup that happens to
  // succeed.
  string device_id = 1;
  string refresh_token = 2;
}

message RefreshSessionResponse {
  // A fresh session token, exactly as Login returns.
  string token = 1;
  string expires_at = 2;
  // And a fresh REFRESH token. The old one is dead the moment this returns:
  // that is what makes presenting it again evidence of a replay rather than an
  // ordinary retry.
  string refresh_token = 3;
}

message LoginRequest {
  string username = 1;
  string password = 2;

  // device_id groups sessions from one browser profile, so the account screen
  // can later revoke a device rather than a token. The client generates and
  // persists it; an empty value gets one assigned server-side.
  string device_id = 3;
}

message LoginResponse {
  // token is the bearer credential. Sent on every subsequent RPC as
  // `authorization: Bearer <token>`.
  string token = 1;
  // expires_at is RFC3339. The client uses it to decide when to stop trusting a
  // stored token without a round trip; the server checks it in SQL regardless,
  // because a client-side expiry is a suggestion.
  string expires_at = 2;
  string username = 3;
  string role = 4;
  // device_id echoes what the session was filed under — assigned here when the
  // request left it empty.
  string device_id = 5;
  // refresh_token is the FIRST token of this device's family (§7.3).
  //
  // Handed out at login rather than fetched later, because a client that has to
  // ask for one has a window in which it holds a session it cannot renew — and
  // the whole point of the family is that renewal is the only way a session
  // continues, so reuse is detectable.
  string refresh_token = 6;
}

message LogoutRequest {}

message LogoutResponse {}

message WhoAmIRequest {}

message WhoAmIResponse {
  string username = 1;
  string role = 2;
  string tenant_id = 3;
  // dev_mode reports that the server is serving an unauthenticated local
  // account. Surfaced so the client can say so out loud — an instance that
  // thinks it is a private laptop while facing the internet is exactly the
  // failure this service was added to prevent, and it should be visible rather
  // than inferred.
  bool dev_mode = 4;
}
