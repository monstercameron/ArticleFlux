syntax = "proto3";

package articleflux.v1;

option go_package = "github.com/monstercameron/ArticleFlux/internal/pb/articleflux/v1;articlefluxv1";

// ReaderService is the reading surface: the sidebar, the list, the article, and
// the four state changes a reader can make.
//
// One service rather than several because all three transports (§20.7) route
// through one service layer — the gRPC tunnel the web client uses, the plain
// HTTPS offline-pack channel, and the Google Reader-compatible REST API that
// Reeder and NetNewsWire speak. Splitting them would let "marked read in Reeder"
// diverge from the web UI, which is the failure the single layer exists to
// prevent.
service ReaderService {
  // ListFeeds returns the sidebar: every subscription with its unread count.
  rpc ListFeeds(ListFeedsRequest) returns (ListFeedsResponse);

  // ListItems returns one page of the item list.
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);

  // GetItem returns one item with its full content.
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  // What an article used to say (TODO F34). Separate from GetItem because the
  // history is several full copies of a body and almost nobody asks for it: it
  // is a click on the "edited" badge, not part of opening an article.
  rpc GetItemRevisions(GetItemRevisionsRequest) returns (GetItemRevisionsResponse);
  // Scrolls a live view (§10.1d). Unary and coalesced client-side: wheel events
  // fire dozens per second and one RPC each would flood the tunnel to move a
  // page a few hundred pixels.
  rpc ScrollLiveView(ScrollLiveViewRequest) returns (ScrollLiveViewResponse);

  // SetItemState marks read/unread and starred/unstarred. One RPC rather than
  // four because they share a row, a rev, and an idempotency key — and because
  // the offline outbox replays them together.
  rpc SetItemState(SetItemStateRequest) returns (SetItemStateResponse);

  // UndoMarkAllRead reverses one bulk mark, using the token that mark returned.
  //
  // Bulk marking is the largest irreversible action in the app: one press turns
  // thousands of unread items into none, and a reader who meant one feed and had
  // "All feeds" selected has lost their backlog. Every row in a batch shares the
  // exact read_at the operation wrote, so the batch is identifiable without a
  // journal table — and rows that were ALREADY read keep their earlier stamp, so
  // an undo cannot resurrect something read last week.
  rpc UndoMarkAllRead(UndoMarkAllReadRequest) returns (UndoMarkAllReadResponse);

  // MarkAllRead marks a whole feed or the whole megafeed read.
  rpc MarkAllRead(MarkAllReadRequest) returns (MarkAllReadResponse);

  // Subscribe adds a feed by URL. The source is global (A14), so this usually
  // attaches an existing row rather than creating one.
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);

  // Unsubscribe removes the subscription. It never deletes the source (A22).
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse);

  // AnalyzeSite answers "can I follow this page?" for an address that is not
  // itself a feed — the subscribe ladder of §11, deterministic first.
  //
  // Rungs 1-3 are free and always run: <link rel="alternate">, then a short
  // list of conventional paths, each candidate FETCHED AND PARSED before it is
  // offered. The LLM proposes and the parser disposes, which here means no
  // candidate reaches the reader on a model's say-so.
  //
  // Rung 5 — a scrape rule written by the model — runs only when `smart` is set,
  // which the client sends only when the reader pressed the button that says
  // what it costs. It sends the page's markup to OpenAI (§18.8), so it is
  // per-request consent rather than a setting somebody turned on last month.
  rpc AnalyzeSite(AnalyzeSiteRequest) returns (AnalyzeSiteResponse);

  // SubscribeScrape subscribes to a page that has no feed, using a rule
  // AnalyzeSite produced and the reader accepted.
  //
  // Separate from Subscribe rather than a mode of it: this one carries a rule,
  // creates a source with kind='scrape', and is the only path that can write
  // scrape_rules. One RPC that meant two different things would have to accept
  // an empty rule and decide what that meant.
  rpc SubscribeScrape(SubscribeScrapeRequest) returns (SubscribeScrapeResponse);

  // Refresh polls sources now instead of waiting for the scheduler.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // Search runs a full-text query (FTS5, G1).
  rpc Search(SearchRequest) returns (SearchResponse);

  // GetPrefs returns this user's UI preferences.
  //
  // Server-side rather than localStorage because layout is part of an account,
  // not of a browser: a reader that forgets your pane widths when you open it on
  // a different machine has not remembered anything useful.
  rpc GetPrefs(GetPrefsRequest) returns (GetPrefsResponse);

  // SetPrefs merges keys into this user's preferences. A merge, not a replace,
  // so a stale client cannot erase settings it does not know about.
  rpc SetPrefs(SetPrefsRequest) returns (SetPrefsResponse);

  // ListTags returns this user's tags and which feeds carry them.
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);

  // SetFeedTag adds or removes a tag on a feed, creating the tag on first use.
  // Nobody wants to manage a taxonomy; they want to label the thing in front of
  // them, and the tag list is the consequence.
  rpc SetFeedTag(SetFeedTagRequest) returns (SetFeedTagResponse);

  // UpdateTag changes how a tag looks in the rail — its label and its glyph —
  // without touching the tag itself.
  //
  // There is no matching GetTagSettings, and that asymmetry with the feed panel
  // is deliberate: ListTags already returns everything the tag panel shows, so
  // fetching it again would be a round trip for data the client is holding. The
  // panel opens instantly as a result, which a settings dialog should.
  rpc UpdateTag(UpdateTagRequest) returns (UpdateTagResponse);

  // ListFolders returns this user's categories — the named groups the rail
  // files feeds under.
  //
  // A category is WHERE a feed lives; a tag is something you say ABOUT it. That
  // is why a feed has at most one folder and any number of tags, and why the
  // two are separate concepts rather than one with a flag.
  //
  // No feed counts on the wire: ListFeeds already carries folder_id on every
  // feed, so the rail derives them. A second source of the same number is a
  // second thing to keep in step, and the one that drifts is always the one
  // nobody is looking at.
  rpc ListFolders(ListFoldersRequest) returns (ListFoldersResponse);

  // CreateFolder makes a category. Naming one that already exists returns the
  // existing row rather than a duplicate — see the request message.
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse);

  // RenameFolder changes a category's name. Unlike a tag, the name IS editable:
  // nothing else refers to a folder by name, so renaming one renames the row
  // rather than orphaning a key.
  rpc RenameFolder(RenameFolderRequest) returns (RenameFolderResponse);

  // DeleteFolder removes the category and unfiles its feeds. It never
  // unsubscribes anything — deleting a shelf is not deleting the books.
  rpc DeleteFolder(DeleteFolderRequest) returns (DeleteFolderResponse);

  // SetFeedFolder files a feed, or unfiles it when folder_id is empty.
  rpc SetFeedFolder(SetFeedFolderRequest) returns (SetFeedFolderResponse);

  // SetNote writes or clears the note on an item. An empty body deletes it, so
  // "has a note" stays an existence check.
  rpc SetNote(SetNoteRequest) returns (SetNoteResponse);

  // ListNotes returns the items this user has annotated, most recently written
  // first — it is a list of your own writing, found by when you wrote it.
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);

  // GetFeedSettings returns everything the per-feed panel shows, and
  // UpdateFeedSettings writes back only the fields that were sent.
  //
  // Two RPCs rather than folding this into ListFeeds: the sidebar asks for 151
  // feeds many times a session and does not want health strings, poll intervals
  // or cache depths on any of them.
  rpc GetFeedSettings(GetFeedSettingsRequest) returns (GetFeedSettingsResponse);
  rpc UpdateFeedSettings(UpdateFeedSettingsRequest) returns (UpdateFeedSettingsResponse);

  // RecordEngagements appends observations to the signals log (§18.1).
  //
  // Batched, because the alternative is an RPC per scroll sample. Partial
  // success is a normal outcome rather than an error: one malformed event in a
  // batch of two hundred must not discard the other 199, and the client cannot
  // usefully repair it anyway.
  //
  // This is the one RPC whose failure the client is expected to swallow. A
  // broken signals layer may cost a worse ranking; it may never cost a page
  // that will not load.
  rpc RecordEngagements(RecordEngagementsRequest) returns (RecordEngagementsResponse);
}

// Feed is one subscription as the sidebar needs it.
message Feed {
  string id = 1;          // subscription id
  string source_id = 2;
  string title = 3;
  string feed_url = 4;
  string site_url = 5;
  int32 unread_count = 6;
  string folder_id = 7;
  // Health, so the dormant-feed nudge has something to read. A reader that
  // cannot tell you a feed died is not finished.
  string last_success_at = 8;
  int32 consecutive_failures = 9;
  string last_error = 10;
}

// Item is one entry. Content is omitted from list responses and present only in
// GetItem — a 50-item page carrying full article bodies is megabytes over a
// tunnel for text nobody has scrolled to yet.
message Item {
  string id = 1;
  string source_id = 2;
  string source_title = 3;
  string title = 4;
  string author = 5;
  string summary = 6;
  string url = 7;
  string published_at = 8;   // RFC3339 UTC
  bool read = 9;
  bool starred = 10;
  int32 word_count = 11;
  string image_url = 12;
  string content_html = 13;  // GetItem only
  // The user's note, when there is one. Present on GetItem and on the notes
  // list; omitted elsewhere so an ordinary page does not carry prose nobody
  // asked for.
  string note = 15;
  // Why this item is in the ranked megafeed. Every ranked item carries its
  // reason, because a reason is what makes feedback actionable.
  string rank_reason = 14;
  // The reader's verdict: +1 liked, 0 none, -1 disliked.
  //
  // A signed number rather than two booleans because the two are mutually
  // exclusive by definition, and a pair of flags makes "liked AND disliked"
  // representable — a state every consumer would then need a policy for.
  int32 rating = 16;
  // A short-TTL signed URL that serves this article's page through our own
  // proxy (plan.md §10.1b). GetItem only, and empty whenever the instance has
  // the page proxy off or the item has no URL to fetch.
  //
  // It is a field rather than an RPC because the client needs it at exactly the
  // moment it already has the article: a separate MintProxyURL call would be a
  // round trip on every article open to produce a string the server had already
  // computed everything for. It expires in hours, which is why it is minted per
  // GetItem rather than stored.
  string proxy_url = 17;
  // A short-TTL signed URL that streams a live browser view of this article's
  // page as MJPEG (plan.md §10.1d). GetItem only, and empty unless the instance
  // has the live view turned on AND found a browser to run it with.
  //
  // Separate from proxy_url rather than a mode parameter on it, because the two
  // are different rungs with different costs: one re-serves markup, the other
  // holds a browser tab open for as long as you look at it. The client decides
  // which to show; the server decides which are available at all.
  string stream_url = 18;
  // A short-TTL sealed URL that reads this article aloud in the Smart+ voice
  // (plan.md §10.7). GetItem only, and empty whenever the instance has no
  // OpenAI key — which is the signal the client uses to leave the control on
  // the browser's own synthesiser instead of offering an upgrade that cannot
  // work.
  //
  // It exists for the same reason proxy_url does, and one more: an `<audio
  // src>` cannot send an Authorization header. Without a capability in the URL
  // itself, /speech can only identify a caller through the DevMode fallback,
  // so the whole feature is dev-only. Unlike the two above the ticket is
  // SEALED rather than signed, because this capability is per-reader: it
  // carries who may hear it, and an identity in a query string would land in
  // history, referrers and access logs in the clear.
  string speech_url = 19;

  // Why this item is on the ranked page, as separate clauses (§18.9).
  //
  // rank_reason above carries the strongest single one and predates this; both are
  // sent, because they are read in different places. A list row shows one line, and
  // the My Feed row shows a chip per clause — "several feeds carried this",
  // "matches your camera reading", "on screen several times and still unread" — which
  // is what makes the ranking correctable rather than merely explained. A reader who
  // can see WHICH judgement they disagree with can act on that one.
  //
  // Ordered strongest first, by absolute contribution to the score, so a client that
  // has room for two chips shows the two that mattered.
  repeated string rank_reasons = 20;
  // Which slot of §18.4's three this item filled: top | explore | cluster_head.
  //
  // On the wire because it is a fact about the RANKING, not about the item, and the
  // client cannot recompute it — Explore deliberately serves under-served topics, so
  // an item there is not simply a lower-scoring Top item and must not be presented as
  // one.
  string rank_slot = 21;
  // Which tier produced this pick: smart | smart_plus.
  //
  // The reader paid for Smart+ or they did not, and when they did they are entitled
  // to know which picks it actually influenced. It is also the honest way to show
  // that free Smart did most of the work, rather than implying a key is what makes
  // the page good.
  string rank_tier = 22;
  // The topic this pick matched, when it matched one. Empty otherwise.
  //
  // It is on the wire as the cold-start signal, which is the thing it is hardest to
  // get any other way. Topics need roughly 50–100 engaged items to mean anything
  // (§18.4), so a new reader's ranking is freshness and feed affinity with no topic
  // term at all — and the client has to be able to SAY that rather than present a
  // confident wrong answer. An empty value on every row is how it knows.
  //
  // An id rather than the label: the client already needs a topic list for Trends,
  // and shipping the label per item would send the same string on fifty rows and
  // still go stale the moment the reader renames it.
  string rank_topic = 23;
  // The scoring FACTORS behind rank_reasons, positionally parallel to it: topic, feed,
  // domain, fresh, corroboration, manual, volume, duplicate, negative, skipped,
  // external, deliberate.
  //
  // These are the machine keys and rank_reasons is the prose, and the client needs both
  // for reasons that have nothing to do with each other.
  //
  // The prose is generated in Go, on the server, in English. Rendering it directly is
  // the only place in the UI that bypasses the message catalogue entirely — and it
  // evades the hardcoded-copy lint precisely because the literal is not in the client,
  // it arrives over the wire. The term is what a localised label is keyed on.
  //
  // The prose is also written as a clause in a longer sentence, so it truncates to
  // "from a feed you rea…" in a list row and tells the reader nothing. A key lets the
  // client pick a label that fits the space it actually has, and keep the sentence for
  // the hover.
  //
  // Parallel arrays rather than a repeated message: this rides on Item, which is the
  // hottest message on the wire, and a submessage per reason costs a length prefix and
  // a field tag per entry on a list of fifty rows for no gain a client can use.
  repeated string rank_reason_terms = 24;
  // The article's category, from the classifier (plan.md §27, M29).
  //
  // A slug — `security`, `filmtv` — resolved against the shipped taxonomy plus
  // whatever the reader changed. **Empty is a real and common answer**: roughly
  // half of a live feed clears no category's floor, and the list renders no chip
  // rather than a wrong one (R23).
  string category = 25;
  // Up to two more that are also true. A CVE in a game engine is security first
  // and gaming second; an article about one subject is not three categories.
  repeated string secondary_categories = 26;
  // The terms that put it there, best first, for the "why" line. A handful, not
  // the whole match set — this is a reason a reader can act on, not an audit.
  repeated string category_reason = 27;
  // The article's FORM: news, analysis, opinion, tutorial, release, review,
  // interview, roundup, research, announcement. Independent of the subject —
  // release notes for a database and an essay about that database are the same
  // category and different genres.
  string genre = 28;
  // True when the model read this article rather than the free-tier lexicon.
  //
  // Surfaced so the reader can tell the two apart, which matters the moment a
  // label is wrong: "the model chose this" and "a term list chose this" have
  // different remedies, and a UI that hides the difference sends people to edit
  // a lexicon that was never consulted.
  bool category_by_model = 29;

  // Article revisions (TODO F34). Numbered well clear of the classifier block
  // above so the two lanes can extend without a renumbering collision.
  //
  // How many times the publisher changed this article's text after we first
  // stored it. Zero — the overwhelming majority — means "as published".
  int32 revision = 40;
  // When we NOTICED the most recent change, RFC3339, empty for an unedited
  // article. A poll timestamp, not the publisher's: a UI built on this must say
  // "we saw this change", because claiming to know when it was made would be a
  // fact no feed supplies.
  string edited_at = 41;
}

// ScrollLiveViewRequest scrolls a running §10.1d live view.
//
// The session is named by the signature from its stream URL: holding a valid
// one is what authorised opening the view, and it is the same proof for moving
// it. Deltas are wheel deltas in CSS pixels and are clamped server-side.
message ScrollLiveViewRequest {
  string session_id = 1;
  double delta_x = 2;
  double delta_y = 3;
}

message ScrollLiveViewResponse {
  // False when the session is gone — timed out, or its viewer left. The client
  // uses it to stop sending into a void and to say so on screen, which is the
  // difference between "this page will not scroll" and "this view has ended".
  bool live = 1;
}

message ListFeedsRequest {}

message ListFeedsResponse {
  repeated Feed feeds = 1;
  int32 total_unread = 2;
  // How many items are on the ranked page right now — My Feed's count.
  //
  // It rides with the sidebar rather than being its own RPC because the RAIL needs it, and
  // the rail is rendered from this response. A separate call would mean the count appeared a
  // beat after the row it belongs to, or — worse — only after the reader had already opened
  // My Feed, which is precisely when they no longer need to be told how much is in it.
  //
  // A different number from total_unread and deliberately so: that one is "how much is
  // waiting", this one is "how much is worth reading". They diverge by an order of magnitude
  // in normal use — 3,733 unread against 123 ranked — and that gap is the feature.
  //
  // Zero is a real value, not a missing one: an account whose interest layer has not run, or
  // one that has read everything ranked, genuinely has none.
  int32 ranked_count = 3;
}

// Scope selects what a list request is about.
enum ListScope {
  LIST_SCOPE_UNSPECIFIED = 0;
  LIST_SCOPE_ALL = 1;       // everything subscribed
  LIST_SCOPE_FEED = 2;      // one feed, via source_id
  LIST_SCOPE_STARRED = 3;
  LIST_SCOPE_MEGAFEED = 4;  // the ranked homepage
  LIST_SCOPE_LIKED = 5;     // rating > 0
  LIST_SCOPE_DISLIKED = 6;  // rating < 0
}

message ListItemsRequest {
  ListScope scope = 1;
  string source_id = 2;
  // source_ids selects several feeds at once, which is what a tag is: a set of
  // subscriptions. Kept separate from source_id rather than replacing it, so the
  // common single-feed case stays one string on the wire.
  repeated string source_ids = 6;
  bool unread_only = 3;
  // Opaque keyset cursor (§20.7). Never an offset: OFFSET degrades exactly when
  // a list gets long enough for paging to matter.
  string cursor = 4;
  int32 limit = 5;  // default 50, max 200
}

message ListItemsResponse {
  repeated Item items = 1;
  string next_cursor = 2;  // empty when the list is exhausted

  // total is how many items this query matches in all, so a virtualised client
  // can give its scrollbar the true shape of the result set before it has
  // fetched the result set. Without it a lazy list can only be as tall as the
  // pages already loaded — the scrollbar grows in jumps as you scroll and you
  // cannot drag to a position that has not loaded yet.
  //
  // Sent only on the FIRST page (empty cursor) and zero thereafter: it does not
  // change while paging, and a COUNT on every page is work nobody reads.
  int32 total = 3;
}

message GetItemRequest { string id = 1; }
message GetItemResponse { Item item = 1; }

// One superseded version of an article (TODO F34).
//
// The version stored is the one being REPLACED, not the one replacing it: the
// current text always lives on the Item, so keeping the new copy here would
// give two copies of the present and none of the past.
message ItemRevision {
  string title = 1;
  string summary = 2;
  string content_html = 3;
  // When we saw this version, not when the publisher wrote it — a feed carries
  // no honest signal for the latter.
  string seen_at = 4;
}

message GetItemRevisionsRequest {
  string item_id = 1;
  // Zero means the server's default. A handful is the useful answer; nobody
  // reads the twentieth version of a wire story.
  int32 limit = 2;
}
message GetItemRevisionsResponse {
  // Newest first. Empty for the overwhelming majority of articles, and for
  // every article that existed before we started hashing bodies — an empty
  // history means "no edit seen", never "no edit happened".
  repeated ItemRevision revisions = 1;
}

message SetItemStateRequest {
  string item_id = 1;
  // Tri-state: unset leaves the flag alone, so marking read does not clobber a
  // star set on another device.
  optional bool read = 2;
  optional bool starred = 3;
  // Tri-state like the others: unset leaves the stored verdict alone, so marking
  // an item read on one device does not erase the fact that you disliked it on
  // another. Values outside {-1,0,1} are clamped by the server.
  optional int32 rating = 5;
  // Required for anything replayed from the offline outbox (§20.7), so a partial
  // drain that reconnects mid-flight cannot double-apply.
  string idempotency_key = 4;
}

message SetItemStateResponse {
  Item item = 1;
  // Server-assigned and monotonic (A25). Ordering never uses a client clock: a
  // phone offline for a week has drifted time.
  int64 rev = 2;
}

message MarkAllReadRequest {
  ListScope scope = 1;
  string source_id = 2;
  // Only items at or before this instant are affected, so an article that
  // arrives mid-request is not silently marked read.
  string before = 3;
  string idempotency_key = 4;
}

message UndoMarkAllReadRequest { string undo_token = 1; }
message UndoMarkAllReadResponse { int32 restored = 1; }

message MarkAllReadResponse {
  int32 marked = 1;
  // undo_token identifies exactly the rows this call marked, so the client can
  // offer to put them back. It is the batch's read_at stamp, which every row it
  // wrote shares — no journal table, and no server-side session state to expire.
  string undo_token = 2;
}

message SubscribeRequest {
  string url = 1;  // feed URL, or a site URL to run discovery against
  string folder_id = 2;
  string title = 3;
}

message SubscribeResponse {
  Feed feed = 1;
  // True when the source already existed and was simply attached. A14 means a
  // popular feed is polled once no matter how many tenants subscribe.
  bool source_existed = 2;
}

message UnsubscribeRequest { string source_id = 1; }
message UnsubscribeResponse {}

message AnalyzeSiteRequest {
  // The address the reader typed. A site, a blog index, or an article — the
  // last one is the interesting case, because "I am reading this and want more
  // of it" is how most people arrive, and the page they are on is rarely the
  // one the feed is declared on.
  string url = 1;
  // smart asks for the model. Off means rungs 1-3 only, which cost nothing and
  // leave nothing.
  bool smart = 2;
}

// FeedCandidate is a feed that was found AND parsed. Nothing is offered on the
// strength of a URL pattern alone: `item_count` is how many entries came out of
// it, and a candidate that parsed to zero is not a feed the reader wants.
message FeedCandidate {
  string url = 1;
  string title = 2;
  int32 item_count = 3;
  // How it was found: "declared" (a <link rel="alternate">) or "probed" (a
  // conventional path). Shown, because "we found this where the site says it is"
  // and "we guessed this address" are different claims.
  string how = 4;
}

// ScrapeRule is §14.2's selector set, on the wire so the reader can see it and
// so the client can send back exactly what it was shown.
//
// It is deliberately readable rather than opaque: a reader who knows CSS can
// tell at a glance whether `article.post h2 a@href` is plausible, and one who
// does not can still see the samples underneath it. An opaque blob would ask
// them to trust the model with no way to check it.
message ScrapeRule {
  string item_selector = 1;
  string title_selector = 2;
  string link_selector = 3;
  string date_selector = 4;
  // date_layout is a Go time layout for dates that are not machine-readable.
  // Empty means the value parses on its own.
  string date_layout = 5;
  string summary_selector = 6;
  string image_selector = 7;
  string author_selector = 8;

  // kind is "html" (the fields above are CSS selectors, the default) or "json"
  // (they are dotted paths into an API response: "comic.chapters",
  // "full_title").
  //
  // One message, two dialects, rather than a second message with eight parallel
  // fields. A page that renders itself in the browser has nothing to select but
  // its entries are one GET away, and everything downstream of extraction —
  // preview, storage, polling, ingest — wants to treat the two identically.
  string kind = 9;
  // data_url is where a json rule fetches from. Empty for html rules, which read
  // the page itself. Enforced to be the same site as index_url: without that the
  // RPC would be an open proxy that fetches any address hourly forever.
  string data_url = 10;
  // link_template builds a URL from an entry's fields when a json response
  // describes an entry without giving its address:
  // "https://example.com/read/{slug}/ch/{chapter}".
  string link_template = 11;
  // id_selector is the entry's stable identity, for responses that carry one.
  // It is what "have I seen this?" reads, so an API that renumbers its URLs does
  // not re-deliver its whole archive as new.
  string id_selector = 12;
}

// ScrapeSample is one item the proposed rule actually produced, from the page as
// it is today. Samples are the evidence: a rule is accepted or rejected on what
// it extracted, not on how confident anything claims to be.
message ScrapeSample {
  string title = 1;
  string url = 2;
  string published_at = 3;
  string summary = 4;
}

message ScrapeProposal {
  string index_url = 1;
  ScrapeRule rule = 2;
  repeated ScrapeSample samples = 3;
  // found is how many items the rule matched on the page, which can exceed the
  // samples returned.
  int32 found = 4;
  // notes is the model's one-line account of what it keyed on, in its own words.
  string notes = 5;
}

message AnalyzeSiteResponse {
  // page_title is the site's own <title>, so the dialog can name what it found
  // rather than echoing a URL back.
  string page_title = 1;
  repeated FeedCandidate feeds = 2;
  ScrapeProposal scrape = 3;
  // smart_status says why there is no proposal, so the dialog can offer the fix
  // rather than a shrug:
  //   "" ...........  a proposal is present, or none was asked for
  //   "not_asked" ..  rungs 1-3 found nothing and smart was off
  //   "no_key" ....   this instance has no OpenAI key (an admin adds one)
  //   "refused" ...   robots.txt asks us not to read this page
  //   "failed" ....   the model answered and the parser rejected what it said
  string smart_status = 4;
}

message SubscribeScrapeRequest {
  string index_url = 1;
  string title = 2;
  string folder_id = 3;
  ScrapeRule rule = 4;
}

message SubscribeScrapeResponse {
  Feed feed = 1;
  // items is how many the first poll ingested, so the dialog can say "added, 12
  // articles" rather than leaving the reader to guess whether it worked.
  int32 items = 2;
}

message RefreshRequest {
  // Empty means every subscribed source.
  repeated string source_ids = 1;
}

message RefreshResponse {
  int32 sources_polled = 1;
  int32 new_items = 2;
  repeated string errors = 3;
}

message SearchRequest {
  string query = 1;
  string source_id = 2;
  int32 limit = 3;
}

// SearchResponse is structurally the same as ListItemsResponse but distinct, so
// search can grow the things only search needs — snippets, bm25 scores, facets —
// without changing the shape every list response carries.
message SearchResponse {
  repeated Item items = 1;
  // snippet() output per item, index-aligned with items. Kept parallel rather
  // than inside Item so a list response never carries an empty snippet field.
  repeated string snippets = 2;
  int32 total = 3;
}

message GetPrefsRequest {}

message GetPrefsResponse {
  map<string, string> prefs = 1;
}

message SetPrefsRequest {
  map<string, string> prefs = 1;
}

message SetPrefsResponse {}

message Tag {
  string id = 1;
  // name is the IDENTITY: the word typed to file a feed, and the handle
  // SetFeedTag takes. It is never changed by a rename — see label.
  string name = 2;
  int32 feed_count = 3;
  // label is the reader's own name for the tag's row in the rail. Empty means
  // "use name", exactly as FeedSettings.title is empty to mean "use the
  // publisher's" — so there is never a second copy of the name to drift.
  //
  // Sent alongside name rather than pre-resolved into one field because the
  // client needs BOTH: the label to draw the row, and the name to send back
  // when a tag is added to or removed from a feed.
  string label = 4;
  // glyph is one character from the internal/tagglyph catalogue, or empty for
  // the section default. The server validates it against that catalogue; a
  // client is not trusted to put arbitrary text into everyone's sidebar.
  string glyph = 5;
}

message ListTagsRequest {}

message ListTagsResponse {
  repeated Tag tags = 1;
  // Tag ids per source id, so the sidebar renders without a query per feed.
  map<string, TagIDs> by_source = 2;
}

// TagIDs exists because protobuf maps cannot have a repeated value directly.
message TagIDs {
  repeated string ids = 1;
}

message SetFeedTagRequest {
  string source_id = 1;
  string name = 2;
  bool on = 3;
}

message SetFeedTagResponse {
  Tag tag = 1;
}

// UpdateTagRequest patches how a tag PRESENTS. Same tri-state rule as
// UpdateFeedSettingsRequest: unset means "leave it alone".
//
// Note what is absent: `name`. The identity is not editable here, and that is
// the point of the message rather than an omission. A tag is created by use and
// removed with its last association, so its name is the handle a reader has on
// it everywhere else in the app; letting a settings panel change that out from
// under the chips and the tag field would be renaming the key, not the label.
message UpdateTagRequest {
  string tag_id = 1;
  // An empty string is meaningful and is sent rather than skipped: it CLEARS
  // the override and restores the tag's own name. Distinguishing "clear it"
  // from "leave it alone" is exactly what the optional is for.
  optional string label = 2;
  optional string glyph = 3;
}

message UpdateTagResponse {
  Tag tag = 1;
}

// Folder is one category: a named group of subscriptions in the rail.
//
// Flat, deliberately. The table behind it carries parent_id and a depth ceiling
// (plan.md §6.8), and nothing here builds a tree yet — a nesting UI nobody asked
// for is a folder picker that needs a path, a drag target that needs a drop
// zone, and a rail that can indent itself off the right edge. The column stays
// so the day it is wanted is a migration nobody has to write.
message Folder {
  string id = 1;
  string name = 2;
  // position is the rail order. Assigned on create and stable thereafter, so a
  // renamed category does not jump.
  int32 position = 3;
}

message ListFoldersRequest {}

message ListFoldersResponse {
  repeated Folder folders = 1;
}

// CreateFolderRequest names a category.
//
// Creating one that already exists — matched case-insensitively — returns the
// existing folder instead of erroring. This is called from the add-a-feed form,
// where "Tech" and "tech" are one intent and an error is a dead end in the
// middle of a task the reader is halfway through.
message CreateFolderRequest {
  string name = 1;
}

message CreateFolderResponse {
  Folder folder = 1;
}

message RenameFolderRequest {
  string folder_id = 1;
  string name = 2;
}

message RenameFolderResponse {
  Folder folder = 1;
}

message DeleteFolderRequest {
  string folder_id = 1;
}

message DeleteFolderResponse {}

// SetFeedFolderRequest files one feed.
message SetFeedFolderRequest {
  string source_id = 1;
  // Empty unfiles the feed. Empty rather than a separate ClearFeedFolder RPC:
  // "no category" is a value the picker offers like any other, and a second RPC
  // would be a second path to keep in step with the first.
  string folder_id = 2;
}

message SetFeedFolderResponse {}

message SetNoteRequest {
  string item_id = 1;
  string body = 2;
}

message SetNoteResponse {}

message ListNotesRequest {
  int32 limit = 1;
}

message ListNotesResponse {
  repeated Item items = 1;
}

message GetFeedSettingsRequest { string source_id = 1; }

// Both RPCs return the same noun. Wrapping it rather than defining the twenty
// fields twice: buf's naming rule wants a per-RPC response message, and the
// alternative — two near-identical messages that drift the first time one is
// edited — is a worse answer than one wrapper each.
message GetFeedSettingsResponse { FeedSettings settings = 1; }
message UpdateFeedSettingsResponse { FeedSettings settings = 1; }

// FeedSettings is one feed's configuration, split by WHO IT BELONGS TO.
//
// That split is A14 made visible rather than a presentation choice. `sources`
// are global and polled once for the whole server, so changing how often one is
// fetched changes it for every other subscriber; `subscriptions` are per-user
// and changing one affects nobody else. A panel that mixed the two would let
// someone quietly reconfigure a shared resource while believing they were
// adjusting their own copy.
message FeedSettings {
  string source_id = 1;

  // --- yours alone (subscriptions) ---
  // title is the reader's own name for the feed. Empty means "use the
  // publisher's", which is why it is sent separately from resolved_title.
  string title = 2;
  string resolved_title = 3;   // what the sidebar actually shows today
  bool in_megafeed = 4;        // eligible for the ranked homepage
  string muted_until = 5;      // RFC3339; empty means not muted
  int32 cache_depth = 6;       // items kept for offline (A5); 0 = none

  // --- shared with every other subscriber (sources) ---
  string feed_url = 10;
  string site_url = 11;
  string kind = 12;            // feed | mailbox | scrape
  int32 fetch_interval_s = 13;
  string next_fetch_at = 14;

  // --- health, read-only ---
  string last_fetch_at = 20;
  string last_success_at = 21;
  string last_error = 22;
  int32 consecutive_failures = 23;
  int32 item_count = 24;       // how much of the database this feed is
  int32 unread_count = 25;
  // subscriber_count is why the shared settings are marked shared. Seeing "3
  // other people on this server read this" is what makes the warning land.
  int32 subscriber_count = 26;
}

// UpdateFeedSettingsRequest patches. Every mutable field is optional, and unset
// means "leave it alone" — the same tri-state rule SetItemState uses, for the
// same reason: a client that only knows about half these fields must not blank
// the other half by omitting them.
message UpdateFeedSettingsRequest {
  string source_id = 1;
  optional string title = 2;
  optional bool in_megafeed = 3;
  optional string muted_until = 4;
  optional int32 cache_depth = 5;
  optional int32 fetch_interval_s = 6;
}

// Engagement is one observation about a reader (§18.1).
//
// `kind` and `surface` are strings rather than enums on purpose. The taxonomy
// lives in internal/signals and grows as the interest layer learns what it can
// see; a proto enum would make every new signal a breaking-change review and a
// client redeploy, and `buf breaking` would be entirely right to object. The
// closed set is enforced at the service boundary instead, where an unknown kind
// can be reported and counted rather than silently accepted.
message Engagement {
  // id is CLIENT-generated and is the dedupe key. The outbox retries batches it
  // could not confirm, so the same event legitimately arrives more than once.
  string id = 1;
  // item_id is empty for signals about a term or a source rather than an
  // article — a search query being the obvious one.
  string item_id = 2;
  // source_id is advisory. The server resolves it from the item when it can, so
  // a client cannot attribute an observation to a feed it did not come from.
  string source_id = 3;
  string kind = 4;
  // value is per-kind: milliseconds, a 0..1 fraction, or a count. See
  // internal/signals.Spec.Value.
  double value = 5;
  string surface = 6;
  // context is a small JSON object of kind-specific facts: {"pos":7,"of":12},
  // {"q":"fts5"}, {"words":1400}. Bounded at 1 KiB.
  string context = 7;
  // session_id groups one sitting. Client-assigned, because the server sees one
  // long-lived tunnel and cannot see a boundary.
  string session_id = 8;
  // at is client-observed unix MILLISECONDS, clamped server-side against the
  // server clock. It is not a conflict-ordering timestamp (A25 forbids those on
  // a client clock) — it is an observation only the client was present for, and
  // dwell is unreconstructible from the arrival time of a batch that came in
  // four minutes late over a reconnect.
  int64 at = 9;
}

message RecordEngagementsRequest {
  repeated Engagement events = 1;
}

message RecordEngagementsResponse {
  // accepted counts rows actually written. It excludes replays, so a client
  // seeing accepted < sent has not necessarily lost anything.
  int32 accepted = 1;
  // rejected counts events that failed validation. Non-zero means the client
  // and the server disagree about the taxonomy, which is a bug worth surfacing
  // in the logs rather than a condition to retry.
  int32 rejected = 2;
}
