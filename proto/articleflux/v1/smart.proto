syntax = "proto3";

package articleflux.v1;

option go_package = "github.com/monstercameron/ArticleFlux/internal/pb/articleflux/v1;articlefluxv1";

// SmartService is the Smart+ tier's control surface: the one API key every
// Smart+ feature spends, and the features that are configuration rather than
// per-article actions.
//
// It is a separate service from ReaderService on purpose. Everything here
// EGRESSES — it sends the reader's content, or the server's configuration, to a
// third party — and keeping that on its own service means the capability map
// (§7) can gate the whole surface with one entry rather than remembering to
// mark individual reader RPCs.
//
// **Most RPCs here are owner-only.** The API key is instance configuration, and
// a translation is a spend against the instance's bill.
//
// The two theming RPCs are the exception, and the line is the same one drawn for
// the Smart+ voice: a member may spend on THEIR OWN reading experience, because
// that is a per-user preference costing the instance nothing they cannot already
// spend, but may not read the key, change the model, or start a translation that
// re-bills the whole instance. See grpcsrv.SmartServer.requireReader.
service SmartService {
  // GetSmartConfig reports whether Smart+ can run at all, and what it has spent.
  //
  // It NEVER returns the API key. `key_hint` is the last four characters, which
  // is enough to answer "is that the key I pasted" and useless to anyone who
  // intercepts it.
  rpc GetSmartConfig(GetSmartConfigRequest) returns (GetSmartConfigResponse);

  // SetSmartConfig stores the OpenAI API key and the model.
  //
  // The key is encrypted at rest. An empty `openai_api_key` with
  // `clear_api_key` set removes it, which is how an instance is switched back
  // to being unable to egress at all.
  rpc SetSmartConfig(SetSmartConfigRequest) returns (SetSmartConfigResponse);

  // ListLanguages returns the offered UI translation targets and which of them
  // are already cached for the running build's English.
  rpc ListLanguages(ListLanguagesRequest) returns (ListLanguagesResponse);

  // ListModels asks the provider which model ids this instance's key can use,
  // for the picker on the Smart tab (replacing a free-text field an operator
  // could mistype into silence). Owner-only, like SetSmartConfig: it spends a
  // call against the instance's own key and reports instance configuration,
  // not a per-reader preference.
  //
  // Unlike every other RPC on this service, nothing here egresses reader
  // content — see internal/llm.Client.Models for why that is allowed to
  // reach a second provider endpoint.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

  // TranslateUI returns the whole UI catalog in one language.
  //
  // Cached per locale against a hash of the English catalog, so a build that
  // changes a string re-translates and one that does not is free. `force`
  // bypasses the cache — the only lever a reader has when a translation came
  // back wrong.
  rpc TranslateUI(TranslateUIRequest) returns (TranslateUIResponse);

  // ComposeTheme turns a phrase into a complete palette (§20.16.3).
  //
  // What leaves the instance is the phrase and the tone, and nothing else — see
  // internal/llm/theme.go for the allowlist and the argument for it.
  //
  // The palette that comes back has already passed the readability floor every
  // shipped theme passes: `repairs` says what had to be moved to get there, which
  // the screen reports rather than hides, because a palette that came back
  // slightly different from the one described is a thing the reader should be
  // told rather than left to suspect.
  rpc ComposeTheme(ComposeThemeRequest) returns (ComposeThemeResponse);

  // SuggestTheme returns where an attuning theme should be drifting to.
  //
  // The reader's interests decide the answer, and the ladder is the usual one
  // (§18.7, §11): deterministic first, model last. With no key — or with Smart+
  // theming switched off — the target is the base theme tinted toward the hue of
  // the reader's largest topic, computed in Go and costing nothing. With a key it
  // is a palette written for those subjects.
  //
  // The CLIENT sends the base it is drifting from, because the client is the only
  // place that resolves which theme is actually being painted, and a second
  // resolution on the server is a second answer.
  //
  // `signature` fingerprints the taste this target came from. The client stores
  // it and only calls again when it changes, which is what keeps a feature that
  // repaints itself daily from being a request that happens daily.
  rpc SuggestTheme(SuggestThemeRequest) returns (SuggestThemeResponse);
}

// ThemeTokens is one complete palette: exactly the fields client/design.Theme
// carries, in Vars() order after the four identity fields.
//
// Explicit fields rather than an opaque encoded string, even though both ends are
// Go and share client/design. The proto IS the contract (§20.7), and a contract
// whose payload is "whatever this build's encoder produces" cannot be read by
// anything else — including the person debugging a palette in a request log.
message ThemeTokens {
  // The stable id. "custom" for a generated theme; a built-in's name when this
  // carries one. Never model-authored — see design.CustomName.
  string name = 1;
  string label = 2;
  string blurb = 3;
  // "dark" or "light". Derived from the ground rather than claimed, because a
  // model naming the mood it was asked for is not describing the palette it
  // produced (design.ToneOf).
  string tone = 4;

  string ground = 10;
  string raised = 11;
  string sunk = 12;
  string line = 13;
  string hair = 14;
  string cream = 15;
  string soft = 16;
  string dim = 17;
  string read = 18;
  string accent = 19;
  string pos = 20;
  string neg = 21;
  // The modal lift. Never model-authored: it is the one token whose value is a
  // whole CSS declaration, and it is derived from the tone (design.GeneratedShadow).
  string shadow = 22;
  // The article gradient's strength, as the token carries it: "14%".
  string wash = 23;
}

// ThemeRepair is one change the readability floor made to a generated palette.
message ThemeRepair {
  // The CSS custom property without its dashes: "mute".
  string token = 1;
  string from = 2;
  string to = 3;
  // A stable reason id, not prose — the client's catalog turns it into a
  // sentence. See design.ReasonUnreadable and friends.
  string reason = 4;
}

message ComposeThemeRequest {
  // The reader's own words. Capped at llm.MaxThemePromptRunes on the way out.
  string prompt = 1;
  // The tone to build for: "dark" or "light". The tone of the theme currently in
  // force, because that is the theme this answer has to be able to blend with.
  string tone = 2;
}

message ComposeThemeResponse {
  ThemeTokens theme = 1;
  repeated ThemeRepair repairs = 2;
  // True when the prompt was longer than the cap and was cut. Said out loud
  // rather than applied silently: a theme that answers half a sentence looks
  // exactly like a model that misunderstood the whole one.
  bool prompt_trimmed = 3;
}

message SuggestThemeRequest {
  // The palette to drift FROM. Validated server-side like any other input.
  ThemeTokens base = 1;
}

message SuggestThemeResponse {
  ThemeTokens target = 1;
  // The interest this target was built from — a topic label, in the reader's own
  // vocabulary. Shown on the Appearance screen, because a theme that changes
  // itself and will not say why is a theme nobody trusts (§18.9).
  string why = 2;
  // A stable fingerprint of the taste behind this target. Opaque to the client,
  // which stores it and compares it.
  string signature = 3;
  // True when a model wrote this palette, false when it is the deterministic
  // tint. The screen says which, so "I turned Smart+ off and it still drifts" is
  // explainable rather than alarming.
  bool smart = 4;
  repeated ThemeRepair repairs = 5;
}

message GetSmartConfigRequest {}

message GetSmartConfigResponse {
  // Whether a key is stored AND usable. False means every Smart+ feature is
  // unavailable, which is the correct state for an instance nobody configured.
  bool configured = 1;
  // Last four characters of the stored key, or empty. Never the key.
  string key_hint = 2;
  // Whether the server can encrypt secrets at all. False means it has no
  // encryption key on disk, and SetSmartConfig will refuse rather than store a
  // credential in the clear.
  bool can_store_secrets = 3;
  // The model every Smart+ feature uses, and the built-in default when unset.
  string model = 4;
  string default_model = 5;
  // Whether this instance consents to sending ARTICLE TEXT to the model for
  // classification (§27.4e, `smart.classify`). Default off, and off is not a
  // formality: it spends money and egresses the publisher's words.
  //
  // A field on the instance's config rather than a per-reader preference
  // because the decision is about the instance — the text is the publisher's
  // and the bill is the owner's, and a per-reader toggle would imply the
  // reader controls something they do not.
  bool classify_enabled = 6;
  // What the model has cost this instance since the process started, in USD,
  // for the calls the rate tables could price.
  //
  // `priced_calls` and `unpriced_calls` are counts, not money, and they are
  // here because the number above is meaningless without them: a model with no
  // published rate contributes an unknown amount, and reporting it as $0.00
  // would say it was free. "We do not know" and "it was free" are different
  // claims and only one of them is true.
  double cost_usd = 30;
  int64 priced_calls = 31;
  int64 unpriced_calls = 32;
  // The ceiling on that spend, in USD, or 0 for none — which is the default.
  double budget_usd = 33;
  // Tokens spent since this server process started. Not a bill — a signal.
  // Restart-scoped on purpose: a persisted counter that nobody resets becomes a
  // number people stop reading.
  int64 input_tokens = 10;
  int64 output_tokens = 11;
  int64 requests = 12;
  // What the VOICE has spent, beside what the model has (§9, §22.8, TODO P3).
  //
  // The same restart-scoped signal as the token counters above, for the other
  // paid surface: "AI features are off" should be answerable, and so should "how
  // much has listening cost this instance". Speech is billed per CHARACTER, so
  // characters are the number that matters and requests are the context for it.
  //
  // speech_cached counts listens served from `speech-cache` — audio that was
  // already on disk and cost nothing. The hit ratio is
  // `speech_cached / (speech_cached + speech_requests)`, stated here rather than
  // sent as a derived field so it cannot disagree with its own inputs, and it is
  // the number that says whether the cache is earning its disk.
  int64 speech_requests = 13;
  int64 speech_characters = 14;
  int64 speech_cached = 15;
  // True when the key came from OPENAI_API_KEY rather than from this screen.
  // The screen says so, because "I deleted the key and it still works" is
  // otherwise unexplainable.
  bool from_environment = 20;

  // The last time a Smart+ call was REFUSED, and what class of refusal it was.
  //
  // `configured` above can only ever mean "a key is stored". Proving it works
  // costs money, so it does not claim to — and an expired key, a revoked key, a
  // project with no credit and a model this account cannot reach all read as
  // configured, because from where that check stands they are. The result was a
  // screen showing four green prerequisites beside a silent player, with the
  // real answer only in a server log.
  //
  // So the server reports what it has actually observed. This is evidence, not
  // a second opinion: it is set when a call fails and cleared when one
  // succeeds, so "a key is stored, and the last attempt two minutes ago was
  // refused" is sayable, and is the sentence that ends the confusion.
  //
  // last_error is a CLASS, never the provider's own message: that message can
  // quote the article being read aloud, and §22.11 keeps request content out of
  // anything that leaves the process. The operator gets the verbatim text from
  // the log and from `articleflux speech`.
  string last_error = 21;
  // RFC3339, empty when there has been no failure since this process started.
  string last_error_at = 22;
}

message SetSmartConfigRequest {
  // Empty leaves the stored key untouched, so the model can be changed without
  // re-pasting a credential.
  string openai_api_key = 1;
  // Removes the stored key. Explicit rather than inferred from an empty string,
  // because "leave it alone" and "delete it" are different intentions and a
  // form that confuses them deletes credentials by accident.
  bool clear_api_key = 2;
  // Empty leaves the model untouched.
  string model = 3;
  // The consent for sending article text (§27.4e). Optional so that "leave it
  // as it is" is expressible: a form that could only send true or false would
  // turn every unrelated save — a model change, a new key — into a decision
  // about egress that nobody made.
  optional bool classify_enabled = 4;
  // The spend ceiling in USD. Optional for the same reason, and 0 means no
  // ceiling rather than "refuse everything": a cap is something somebody opts
  // into, and the strictest possible reading of an empty field would silently
  // disable every paid feature on the instance.
  optional double budget_usd = 5;
}

message SetSmartConfigResponse { GetSmartConfigResponse config = 1; }

message ListModelsRequest {}

message ListModelsResponse {
  // Sorted, filtered to text/reasoning models — see internal/llm.Client.Models.
  repeated string models = 1;
  // The model currently configured, so the client can show it selected even
  // if it fell out of the live list (a model the account has lost access to,
  // or one entered by hand before this picker existed).
  string current = 2;
  string default_model = 3;
}

message ListLanguagesRequest {}

message ListLanguagesResponse {
  repeated SmartLanguage languages = 1;
  // The locale the catalog is authored in — always available, never translated,
  // never billed.
  string source_locale = 2;
}

message SmartLanguage {
  string code = 1;
  // The language's name in English, and in itself. Both, because a picker with
  // only endonyms cannot be navigated by someone who chose the wrong one.
  string english_name = 2;
  string native_name = 3;
  // Already translated for this build: selecting it costs nothing.
  bool cached = 4;
}

message TranslateUIRequest {
  string locale = 1;
  // Re-translate even if a cached catalog exists.
  bool force = 2;
}

message TranslateUIResponse {
  string locale = 1;
  repeated UIMessage messages = 2;
  // True when this came from cache, so the UI can say the switch was free.
  bool cached = 3;
}

// UIMessage is one entry of the catalog, in the flat "namespace.key" form the
// client's i18n.T takes.
message UIMessage {
  string key = 1;
  // The message. Empty when this is a pluralised message, in which case forms
  // carries it instead.
  string text = 2;
  // Plural forms, keyed by CLDR category: zero, one, two, few, many, other.
  map<string, string> forms = 3;
}
