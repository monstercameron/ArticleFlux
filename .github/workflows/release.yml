# Release — verify, build the container image, publish to GHCR, poke the droplet.
#
# The AFF-shaped deployment (deploy/docker/): one ritual — promote dev -> main, tag
# vX.Y.Z on main, push the tag. This verifies the tree, bakes the release
# image (server + client wasm), pushes it, and POSTs the deploy hook; the box's
# af-reader-autoupdate.sh does the tag comparison and a health-gated rollout with a
# recorded rollback tag. No inbound SSH from CI; the box pulls.
#
# This REPLACES the deployhook.service "deploy on CI green on main" flow for ArticleFlux:
# a release is a deliberate act (a tag a human pushes), and a docs commit to main no
# longer restarts the reader mid-someone's-breakfast.
#
# workflow_dispatch (and any dev push touching deploy/docker/**) runs verify + a NO-PUSH
# image build: the dry run that proves the Dockerfile before any tag exists.
name: Release

on:
  push:
    tags: ['v*']
    branches: ['dev']
    # .dockerignore decides what the build can see, so a change to it is a change to the
    # build and gets the same dry run as the Dockerfile.
    paths: ['deploy/docker/**', '.dockerignore', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/monstercameron/articleflux
  GO_VERSION: '1.27.4'

jobs:
  verify:
    name: Verify before shipping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build (server + client wasm compile)
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # The build context is this checkout and nothing else: every dependency in go.mod
      # is a published module the build stage downloads, so there is no second
      # repository to arrange beside it (see the Dockerfile's header).
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: echo "sha_tag=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # amd64 AND arm64, so the published image runs on a Raspberry Pi, an Ampere box or
      # an Apple-silicon laptop as well as on the droplet. No QEMU step, deliberately: the
      # Dockerfile builds on the runner's own platform and cross-compiles the server (pure
      # Go, CGO off), the wasm client is the same bytes for both and is built once, and the
      # runtime stage has no RUN — so nothing ever executes as arm64. The cost is one extra
      # server compile, about a minute, not the emulated wasm build QEMU would mean.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # GO_VERSION is passed, not left to the Dockerfile's own default: the verify job
          # above tests with env.GO_VERSION, and a Dockerfile default that drifted from it
          # would ship a binary built by a compiler nothing here ever tested.
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
            REVISION=${{ github.sha }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', env.IMAGE, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy hook (pull-based droplet update)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # The hook only STARTS af-reader-autoupdate.sh on the box; a lost delivery is
      # covered by the daily fallback timer, so a non-200 here is a slower deploy, not a
      # failed one.
      - name: POST the deploy hook
        env:
          HOOK_SECRET: ${{ secrets.AF_READER_DEPLOY_HOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$HOOK_SECRET" ]; then
            echo "AF_READER_DEPLOY_HOOK_SECRET is not set — skipping the poke; the daily timer will pick this release up."
            exit 0
          fi
          code=$(curl -sS -o /tmp/hook-body -w '%{http_code}' -m 30 -X POST \
            -H "X-Articleflux-Deploy-Token: $HOOK_SECRET" \
            https://feed.earlcameron.com/internal/deploy-hook || echo 000)
          echo "hook answered $code: $(cat /tmp/hook-body 2>/dev/null || true)"
          if [ "$code" != "200" ]; then
            echo "::warning::deploy hook did not answer 200 — the daily fallback timer will still deploy this release"
          fi
