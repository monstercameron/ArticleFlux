# The public demo — build client/demo and publish it to GitHub Pages.
#
# ArticleFlux is self-hosted, which means "try it" otherwise costs a Go
# toolchain, two clones, a WebAssembly build and a running server. That is a lot
# to ask of somebody who has not decided whether they care yet. This workflow
# removes every step: the demo is a static page whose "server" is an in-memory
# instance compiled into the same module (client/demodata).
#
# WHAT IS PUBLISHED:
#
#   index.html      web/index.html unmodified — the same splash the server serves
#   wasm_exec.js    from the toolchain that produced the module
#   sw.js           web/sw.js with its cache key stamped to this build's version
#   app.wasm.gz     the module, gzipped, and ONLY gzipped
#   fonts.css/fonts the self-hosted typography linked by index.html
#   manifest/icons  the install metadata and launcher artwork
#
# The last one is why the boot shim in web/index.html has a compressed path.
# GitHub Pages cannot negotiate a content encoding for a wasm file, so publishing
# the raw module would hand a stranger a 28 MB download; the shim fetches
# app.wasm.gz and decompresses it in the browser, which is 6 MB. Nothing is
# published uncompressed, so that path is the one this build exercises.
#
# THE SHAPE OF THIS FILE is "prove it works, then publish it":
#
#   build   → test the instance, build, VERIFY THE ARTIFACT, BOOT IT IN A BROWSER
#   deploy  → enable Pages if it is not, and publish what build proved
#
# The verification steps are the point. Every other check in CI can pass while
# the bundle they produced does not start — a truncated gzip, a missing
# wasm_exec.js, an index.html that fetches a path this build does not ship. The
# demo is the only build of this application that strangers see, and it is the
# one nobody is watching when it breaks.
#
# HOW TO PUBLISH:
#
#   git tag -a v1.0.0 -m 'the first public demo' && git push origin v1.0.0
#
# or run this workflow by hand from the Actions tab, which is the same build with
# a version somebody typed instead of one git remembered.

name: Demo (GitHub Pages)

on:
  push:
    tags:
      - "v*"
  # A pull request BUILDS the demo, verifies it, and does not deploy it. "Did
  # that change break the demo?" should be answerable before merging rather than
  # at tag time, when the answer arrives as a broken public URL.
  pull_request:
    paths:
      - "client/**"
      - "web/index.html"
      - "internal/pb/**"
      - "e2e/demo-smoke.mjs"
      - "Makefile"
      - ".github/workflows/pages.yml"
      - ".github/actions/gwc/**"
  workflow_dispatch:
    inputs:
      version:
        description: "What the build calls itself on the settings screen"
        required: false
        default: "v1.0.0"
      deploy:
        description: "Publish it, or just build and verify"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

# One deploy at a time, and never cancel one in flight: a cancelled Pages deploy
# can leave the site half-published, and there is nothing to gain by racing two
# of them. Pull-request builds are a different group and DO cancel, because a
# superseded PR build is only spending money.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26.5"

jobs:
  build:
    name: build · verify · boot
    runs-on: ubuntu-latest
    # Long enough for a cold module cache and a wasm build, short enough that a
    # hung step is noticed the same hour. The whole job is ~5 minutes warm.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # D0 — see .github/actions/gwc. `path: ../GoWebComponents` is not a thing
      # actions/checkout will do, and this is the four lines that make it work.
      - uses: ./.github/actions/gwc

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The version the build reports for itself. A tag names itself; a manual
      # run is told what to say; a pull request is honestly "dev".
      #
      # Written to the step output rather than used inline so there is exactly
      # one place that decides it, and so the log says what was chosen.
      - name: Decide the version
        id: v
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.version || 'dev' }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "this build calls itself ${version}"

      # The demo's backend is ordinary Go with no build tag, so it is testable
      # without a browser — and it is tested here rather than only in the main
      # suite, because a demo whose instance is wrong is a demo that argues for
      # an application that does not work.
      - name: Test the demo instance
        run: go test ./client/demodata/...

      # Through `make`, not an inlined `go build`. The verb is the same one a
      # person runs locally (scripts/make.ps1 demo), so the published artifact
      # and the one somebody previews are produced by the same recipe rather than
      # by two that agree until one is edited.
      - name: Build
        run: make demo VERSION=${{ steps.v.outputs.version }}

      # Everything that can be known about the artifact without running it.
      #
      # Each check below is a failure that has a name. A truncated .gz looks
      # exactly like a successful build until a browser tries to instantiate it;
      # a missing wasm_exec.js fails at instantiate with an import mismatch that
      # reads like a corrupt binary; an index.html with an absolute /app.wasm
      # works perfectly on a server and 404s on a project page. None of them are
      # visible in a green `make demo`.
      - name: Verify the artifact
        run: |
          set -euo pipefail
          cd bin/demo
          echo "--- what was built ---"
          ls -l

          for f in index.html wasm_exec.js app.wasm.gz sw.js fonts.css manifest.webmanifest; do
            [ -s "$f" ] || { echo "::error::bin/demo/$f is missing or empty"; exit 1; }
          done
          [ -d fonts ] && find fonts -type f -name '*.woff2' -print -quit | grep -q . || {
            echo "::error::bin/demo/fonts has no webfont files"; exit 1; }
          [ -d icons ] && find icons -type f -name '*.png' -print -quit | grep -q . || {
            echo "::error::bin/demo/icons has no PNG icons"; exit 1; }

          # The Service Worker's cache identity. It is stamped with THIS build's
          # version rather than shipped verbatim (see the Makefile), because the
          # module is served cache-first and a second demo published under the
          # same key would be invisible to everyone who had already looked.
          want="const VERSION = '${{ steps.v.outputs.version }}';"
          grep -qF "$want" sw.js || {
            echo "::error::sw.js was not stamped with ${{ steps.v.outputs.version }} — returning visitors would keep the previous module"
            grep -n "^const VERSION" sw.js || true
            exit 1; }
          # The module name the loader asks for FIRST. This build publishes only
          # the gzip, so an unstamped index.html takes a 404 on every visit —
          # visible to strangers, invisible to us, and green in every other check.
          grep -qF "const MODULE = 'app.wasm.gz';" index.html || {
            echo "::error::index.html was not stamped to fetch app.wasm.gz — every visitor 404s on app.wasm before the module loads"
            grep -n "const MODULE" index.html || true
            exit 1; }
          grep -q "register('sw.js')" index.html || {
            echo "::error::index.html does not register sw.js relatively, so it 404s on a project page"
            exit 1; }

          # The raw module must NOT be here. Publishing it would mean a 28 MB
          # download for anyone whose browser takes the uncompressed path, which
          # is the entire thing the compressed one exists to avoid.
          if [ -e app.wasm ]; then
            echo "::error::bin/demo/app.wasm was published uncompressed (28 MB)"
            exit 1
          fi

          # Integrity, not just size: gzip -t reads the whole stream and checks
          # its CRC, which is what catches the compressor that died halfway.
          gzip -t app.wasm.gz

          # And it is a WebAssembly module rather than whatever else may have
          # ended up compressed: every wasm binary starts \0asm.
          #
          # Decompressed to a file rather than piped into `head -c 4`. head exits
          # the moment it has its four bytes, gzip gets SIGPIPE writing the fifth,
          # and `set -o pipefail` turns that into a failed step — "gzip: stdout:
          # Broken pipe" with exit 1, from a check that had already succeeded.
          # The file goes to RUNNER_TEMP, never into bin/demo: the raw module must
          # not end up in what gets published, which the check below enforces.
          gzip -dc app.wasm.gz > "$RUNNER_TEMP/app.wasm"
          magic=$(od -An -tx1 -N4 "$RUNNER_TEMP/app.wasm" | tr -d ' ')
          if [ "$magic" != "0061736d" ]; then
            echo "::error::app.wasm.gz does not decompress to a wasm module (magic $magic)"
            exit 1
          fi

          raw=$(stat -c%s "$RUNNER_TEMP/app.wasm")
          gz=$(stat -c%s app.wasm.gz)
          echo "app.wasm.gz: $gz bytes on the wire, $raw decompressed"
          # A module this application's size cannot be under a megabyte. The
          # bound is deliberately far below the real figure (~28 MB): it is here
          # to catch an empty or stub build, not to ratchet the size — that is
          # the wasm-size job's business, and a second ratchet here would be a
          # second number to keep in step.
          [ "$raw" -gt 1000000 ] || { echo "::error::the module is only $raw bytes"; exit 1; }

          # The page and the files it asks for have to agree. Relative, because a
          # project page is served from /<repo>/ and an absolute path resolves to
          # the domain root.
          grep -q "app.wasm" index.html || { echo "::error::index.html never fetches the module"; exit 1; }
          grep -q 'src="wasm_exec.js"' index.html || { echo "::error::index.html does not load wasm_exec.js relatively"; exit 1; }
          if grep -q '"/app.wasm' index.html || grep -q 'src="/wasm_exec.js"' index.html; then
            echo "::error::index.html uses absolute asset paths, which 404 on a project page"
            exit 1
          fi
          grep -q "DecompressionStream" index.html || {
            echo "::error::index.html has no compressed path, and the compressed module is all this publishes"
            exit 1; }

      # Node is pinned rather than "whatever the runner image ships this month",
      # for the same reason the Go version is: the one thing worse than a demo
      # that breaks is a demo that breaks on a day nobody changed anything.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the browser
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # The last check that can fail, and the only one that runs the thing.
      #
      # Everything above proves the bundle is well-formed. This proves it BOOTS:
      # the script serves bin/demo itself — from a static server as unhelpful as
      # Pages is, no compression negotiation and a 404 for anything not on disk —
      # and drives a real browser until the rail lists the seeded feeds and
      # clicking a row changes the article being read.
      #
      # It serves the directory rather than being pointed at one started beside
      # it here, on purpose: a backgrounded server in a YAML step needs a PID, a
      # trap, a wait-for-the-port loop and a kill that behaves on every platform,
      # and none of those four can be tested anywhere except in CI.
      - name: Boot it
        run: node e2e/demo-smoke.mjs bin/demo bin/demo-smoke.png

      # Only on failure, and only the screenshot: it is the difference between
      # "the demo did not boot" and knowing what it showed instead.
      - name: What it looked like when it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-smoke-failure
          path: bin/demo-smoke.png
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: bin/demo

  deploy:
    name: publish
    # A pull request builds and stops. Only a tag, or a deliberate manual run
    # that asked for it, replaces what is on the public URL.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement: true turns Pages on for the repository if nobody has, which
      # removes the one manual step this workflow otherwise depends on — and the
      # failure it removes is a 404 from the deploy step that reads like a
      # permissions problem rather than "Pages was never switched on".
      #
      # It is a no-op when Pages is already configured to build from Actions.
      #
      # Non-fatal on purpose: enabling is a CONVENIENCE, and on a repository
      # where Pages is already on — or where this token cannot administer it —
      # a failure here says nothing about whether the deploy below will work.
      # Let the step that actually publishes be the one that decides.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Where it went
        run: echo "published ${{ steps.deployment.outputs.page_url }}"
