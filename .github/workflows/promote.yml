# Promote dev to main.
#
# The branch policy in CONTRIBUTING.md, made mechanical: work lands on `dev`, and `main`
# advances only by promotion once the gates pass.
#
# Running this DEPLOYS. deployhook watches for THIS WORKFLOW completing successfully and
# redeploys the box, so a promotion is not a merge convenience — it is the release. That is
# why this is a manual trigger with a typed confirmation, never runs on push, and refuses
# any ref but `dev`.

name: Promote dev to main

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to release dev to main (this deploys)'
        required: true
        default: ""

# Never two promotions at once, and never cancel one halfway: the second half of this
# pushes a ref, and a cancelled push is a worse state than a slow one.
concurrency:
  group: promote-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  confirm:
    name: Confirm intent
    runs-on: ubuntu-latest
    steps:
      # Dispatch from `dev`, and nothing else. This is not tidiness — two things
      # downstream are properties of the ref this was launched from, and both are
      # silent when it is wrong:
      #
      #   * deployhook matches this workflow on branch `dev` (see deploy/README.md).
      #     Dispatched from `main`, the run reports head_branch=main, matches no
      #     trigger, and the promotion completes green having deployed nothing.
      #   * head_sha is the dispatch ref's tip, and it is the SHA the deploy's
      #     commit status lands on. From `dev` that is exactly the commit being
      #     released; from `main` it is the commit being replaced.
      #
      # It cost an evening on 2026-07-29: the same promotion was run from `main`
      # and then from `dev`, behaved differently both times, and nothing said why.
      - name: Refuse to promote from any ref but dev
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF" != "dev" ]; then
            echo "::error::dispatched from '$REF'; promote must be run with dev selected as the branch"
            echo "Re-run this workflow and pick 'dev' in the branch dropdown (gh workflow run promote.yml --ref dev)."
            exit 1
          fi

      - name: Check the confirmation word
        # Through env rather than spliced into the script. A `${{ }}` inside a run block is
        # substituted before the shell sees it, so an input carrying shell metacharacters
        # would execute as code.
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "promote" ]; then
            echo "::error::type 'promote' in the confirm box to release dev to main"
            exit 1
          fi

  # Not "CI was green on dev at some point" — the gates run again here, on the tree being
  # promoted. Calling ci.yml rather than restating its steps is what stops promotion from
  # drifting into a weaker check than the one every push gets.
  gates:
    name: Quality gates
    needs: confirm
    uses: ./.github/workflows/ci.yml
    # `dev`, explicitly, and this line is the difference between a release gate
    # and a formality.
    #
    # A local reusable workflow resolves from the CALLER's commit, and this
    # workflow is dispatched on the default branch — so without an explicit ref,
    # ci.yml checked out `main` and the gates tested the code being REPLACED
    # rather than the code replacing it. The comment above claimed the opposite
    # and had been wrong since the file was written. It surfaced the first time
    # it mattered: a promotion failed on a flaky test that dev had already
    # fixed, because dev was never what ran.
    with:
      ref: dev

  promote:
    name: Fast-forward main
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The ancestry check below is meaningless against a shallow clone.
          fetch-depth: 0
          ref: dev

      - name: Fast-forward main to dev
        run: |
          set -euo pipefail
          git fetch origin main dev

          dev_sha="$(git rev-parse origin/dev)"
          main_sha="$(git rev-parse origin/main)"
          echo "dev  $dev_sha"
          echo "main $main_sha"

          if [ "$dev_sha" = "$main_sha" ]; then
            echo "main already matches dev — nothing to promote."
            exit 0
          fi

          # Fast-forward only. If main carries commits dev does not, someone committed
          # straight to main — which the policy forbids — and merging here would bury the
          # evidence under a merge commit instead of surfacing it.
          if ! git merge-base --is-ancestor "$main_sha" "$dev_sha"; then
            echo "::error::main is not an ancestor of dev — refusing to promote."
            echo "These commits are on main but not dev, which means something landed there directly:"
            git log --oneline "$dev_sha..$main_sha" || true
            exit 1
          fi

          echo "promoting:"
          git log --oneline "$main_sha..$dev_sha"

          git push origin "$dev_sha:refs/heads/main"
          echo "main is now $dev_sha"

      # Did the box actually take it?
      #
      # Everything above this point can be green while production serves the
      # previous build, and on 2026-08-01 all of it was: the push landed, the
      # webhook accepted the job, and update.sh reported success in one second
      # having built nothing (it had self-updated, re-execed after the pull, and
      # concluded there was nothing to do). The only way anyone established the
      # truth was to download the wasm module and grep the decompressed bytes.
      #
      # So this workflow no longer ENDS at "main moved" — it ends when the
      # server says it is running what was promoted. /readyz carries the
      # revision as a header, stamped into the binary by the deploy itself, so
      # this is the box reporting rather than a timestamp being interpreted.
      #
      # Non-fatal on purpose. A red promotion after main has already moved
      # cannot un-move it, and the deploy may simply be slow — a cold wasm build
      # on the droplet is about four minutes. What this must never do is stay
      # silent, so a timeout is a loud warning in the summary rather than a
      # failure that would have people re-running a promotion that worked.
      - name: Wait for production to be serving it
        id: live
        continue-on-error: true
        env:
          SHA: ${{ github.sha }}
          URL: https://feed.earlcameron.com/readyz
        run: |
          set -uo pipefail
          echo "waiting for $URL to report ${SHA:0:12}"
          for i in $(seq 1 40); do
            got=$(curl -fsS -m 20 -D - -o /dev/null "$URL" 2>/dev/null \
              | tr -d '\r' | awk 'tolower($1)=="x-articleflux-commit:"{print $2}')
            if [ "$got" = "$SHA" ]; then
              echo "live=true" >> "$GITHUB_OUTPUT"
              echo "production is serving ${SHA:0:12} after $((i*15))s"
              exit 0
            fi
            [ -n "$got" ] && echo "  ${i}: box reports ${got:0:12}, want ${SHA:0:12}"
            sleep 15
          done
          echo "live=false" >> "$GITHUB_OUTPUT"
          echo "::warning::production did not report ${SHA:0:12} within 10 minutes — it may still be building, or the deploy did nothing. Check /var/log/deployhook on the box."

      - name: Summary
        run: |
          {
            echo "### Promoted \`dev\` → \`main\`"
            echo ""
            echo "**This run succeeding is what deploys.** deployhook watches for"
            echo "\`Promote dev to main\` completing successfully on \`dev\` and"
            echo "redeploys the box from \`origin/main\`."
            echo ""
            echo "It is NOT waiting for CI to run on \`main\`, and that is worth"
            echo "stating because this file claimed otherwise until 2026-07-30."
            echo "The fast-forward above is pushed with \`GITHUB_TOKEN\`, and GitHub"
            echo "does not start workflow runs from pushes made with that token — so"
            echo "no \`CI on main\` run is ever created, and a hook waiting for one"
            echo "waits forever. Every promotion between this workflow's first use"
            echo "and that date completed green and deployed nothing."
            echo ""
            if [ "${{ steps.live.outputs.live }}" = "true" ]; then
              echo "✅ **Production is serving \`${GITHUB_SHA:0:12}\`** — confirmed from"
              echo "the \`X-ArticleFlux-Commit\` header on /readyz, which the deploy"
              echo "stamps into the binary it builds."
            else
              echo "⚠️ **Production had NOT reported \`${GITHUB_SHA:0:12}\` after ten minutes.**"
              echo ""
              echo "It may still be building — a cold wasm build on the droplet is"
              echo "about four minutes — or the deploy may have done nothing. That"
              echo "second case is real: on 2026-08-01 this workflow, the webhook and"
              echo "\`update.sh\` were all green while the box served the previous"
              echo "build. Check \`/var/log/deployhook\` and \`/var/log/articleflux\`,"
              echo "and \`curl -sI https://feed.earlcameron.com/readyz\` for what is"
              echo "actually running."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
