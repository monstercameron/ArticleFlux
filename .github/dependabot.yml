# Every dependency is a permanent decision made in thirty seconds — so updates arrive as pull
# requests to be read, not as a stream to be rubber-stamped. Monthly, grouped, and deliberately
# quiet.
#
# GoWebComponents and GoGRPCBridge are ignored on purpose: GWC is consumed through a `replace` to a
# sibling checkout until v5 is tagged, and both are first-party. They move when this project decides
# they move.

version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]
      grpc-and-proto:
        patterns: ["google.golang.org/*"]
      otel:
        patterns: ["go.opentelemetry.io/*"]
    ignore:
      - dependency-name: "github.com/monstercameron/*"
    commit-message:
      prefix: "deps"

  # Playwright only. The application has no JavaScript toolchain.
  - package-ecosystem: npm
    directory: "/e2e"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(e2e)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(ci)"
