# Every dependency is a permanent decision made in thirty seconds — so updates arrive as pull
# requests to be read, not as a stream to be rubber-stamped. Monthly, grouped, and deliberately
# quiet.
#
# Everything under github.com/monstercameron is ignored on purpose. Those modules are first-party
# and developed alongside this one; now that GoWebComponents is an ordinary published requirement
# rather than a `replace` to a sibling checkout, nothing but this rule stops a bot proposing a bump
# to any of them. They move when this project decides they move.

version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]
      grpc-and-proto:
        patterns: ["google.golang.org/*"]
      otel:
        patterns: ["go.opentelemetry.io/*"]
    ignore:
      - dependency-name: "github.com/monstercameron/*"
    commit-message:
      prefix: "deps"

  # Playwright only. The application has no JavaScript toolchain.
  - package-ecosystem: npm
    directory: "/e2e"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(e2e)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(ci)"

  # The container image's two base images (deploy/docker/Dockerfile). They are
  # pinned to a patch tag on purpose, and a pin nobody is told about is how a
  # base image stays on a release whose Go has since had a security fix — the
  # Go one in particular has to move in step with go.mod's toolchain line.
  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(docker)"
